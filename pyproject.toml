[project]
name = "llm-eval-kit"
version = "0.1.0"
description = "Regression testing for LLM apps: YAML suites, deterministic and LLM-as-judge scorers, response cache, baseline diffs and CI-friendly reports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "regression-testing", "claude", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=2.3.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
llm-eval = "llm_eval_kit.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
